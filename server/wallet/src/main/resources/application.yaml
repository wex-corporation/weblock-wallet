server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 400
app:
  filters:
    user-validation-exclude-apis:
      - path: /actuator/health
        method: GET
      - path: /v1/users/sign-in
        method: POST
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001

  name: weblock-wallet
  auth:
    # EdDSA-ed25519 PrivateKey base64url encoded
    secret-key: ${APP_AUTH_SECRET_KEY:}
    public-key: MCowBQYDK2VwAyEAmzzEyhFkjZxi8mJK0lZQD_dSN71HjBEA9nWXA-rh79s
  encryptor:
    # AES Key: openssl rand -hex 32 | xxd -r -p | base64
    secret-key: ${APP_ENCRYPTOR_SECRET_KEY:}

firebase:
  sdk:
    # Provide the service-account credential at deploy time. Supports a classpath
    # resource (default) or a mounted secret via a "file:/abs/path.json" value.
    path: ${FIREBASE_SDK_PATH:rwx-wallet-firebase-adminsdk-ulafh-0d954bcd82.json}

spring:
  main:
    web-application-type: reactive
  r2dbc:
    url: r2dbc:postgresql://weblock-wallet.cficaug2arwh.ap-northeast-2.rds.amazonaws.com:5432/weblockwallet
    username: root
    password: ${WALLET_DB_PASSWORD:}
    pool:
      initial-size: 15
      max-size: 60
  liquibase:
    url: jdbc:postgresql://weblock-wallet.cficaug2arwh.ap-northeast-2.rds.amazonaws.com:5432/weblockwallet
    user: root
    password: ${WALLET_DB_PASSWORD:}
    change-log: classpath:db/masterChangeLog.yaml
  datasource:
    driver-class-name: org.postgresql.Driver
  cloud:
    gcp:
      project-id: rwx-wallet
      credentials:
        encoded-key: ${SPRING_CLOUD_GCP_CREDENTIALS_ENCODED_KEY:}
      logging:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: prod
  r2dbc:
    url: r2dbc:postgresql://weblock-wallet.cficaug2arwh.ap-northeast-2.rds.amazonaws.com:5432/weblockwallet
    username: root
    password: ${WALLET_DB_PASSWORD:}
  liquibase:
    url: jdbc:postgresql://weblock-wallet.cficaug2arwh.ap-northeast-2.rds.amazonaws.com:5432/weblockwallet
    user: root
    password: ${WALLET_DB_PASSWORD:}
    change-log: classpath:db/masterChangeLog.yaml
  main:
    web-application-type: reactive
  cloud:
    gcp:
      project-id: rwx-wallet
      credentials:
        encoded-key: ${SPRING_CLOUD_GCP_CREDENTIALS_ENCODED_KEY:}
      logging:
        enabled: true
app:
  auth:
    # EdDSA-ed25519 PrivateKey base64url encoded
    # publicKey: MCowBQYDK2VwAyEAa-TJ-rXBwz5JW5pXMrqPSUHOTzUKC7HVafU5dR_XJdw=
    secret-key: ${APP_AUTH_SECRET_KEY:}
    public-key: MCowBQYDK2VwAyEAmzzEyhFkjZxi8mJK0lZQD_dSN71HjBEA9nWXA-rh79s
  encryptor:
    # AES Key: openssl rand -hex 32 | xxd -r -p | base64
    secret-key: ${APP_ENCRYPTOR_SECRET_KEY:}
logging:
  level:
    root: info
    org.springframework: debug
    com.wefunding: debug
  file:
    name: application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    path: ./logs

---
spring:
  config:
    activate:
      on-profile: dev
---
spring:
  r2dbc:
    url: r2dbc:postgresql://weblock-wallet.cficaug2arwh.ap-northeast-2.rds.amazonaws.com:5432/weblockwallet
    username: root
    password: ${WALLET_DB_PASSWORD:}
  liquibase:
    url: jdbc:postgresql://weblock-wallet.cficaug2arwh.ap-northeast-2.rds.amazonaws.com:5432/weblockwallet
    user: root
    password: ${WALLET_DB_PASSWORD:}
    change-log: classpath:db/masterChangeLog.yaml
  config:
    activate:
      on-profile: docker-compose
